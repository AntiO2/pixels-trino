name: Full SQL INSERT

on:
  push:
    branches: [feat/trino-insert-180]
    paths:
      - 'connector/**'
      - 'tools/verify-sql-insert.sh'
      - 'tools/ingest-contract/sql-runtime/**'
      - 'docs/insert-development.md'
      - '.github/workflows/sql-insert-e2e.yml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-insert-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PIXELS_HOME: ${{ github.workspace }}/pixels-home
      SQL_E2E_WORK_DIR: ${{ github.workspace }}/verification/sql
      INGEST_DAEMON_WORK_DIR: ${{ github.workspace }}/verification/daemon
      SQL_E2E_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pixels-trino
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AntiO2/pixels
          ref: 56fa575f551ad377d283ba1caa4910a1374b53ac
          path: pixels
          persist-credentials: false
      - name: Record exact source versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification "$PIXELS_HOME/lib" "$PIXELS_HOME/etc"
          cp pixels/pixels-common/src/main/resources/pixels.properties "$PIXELS_HOME/etc/"
          git -C pixels rev-parse HEAD > verification/pixels.commit
          git -C pixels-trino rev-parse HEAD > verification/pixels-trino.commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: |
            pixels/**/pom.xml
            pixels-trino/**/pom.xml
      - name: Build Pixels and run lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pixels/pom.xml \
            -pl pixels-daemon,pixels-cache,pixels-storage/pixels-storage-redis,pixels-turbo/pixels-invoker-spike,pixels-turbo/pixels-invoker-vhive,pixels-turbo/pixels-invoker-lambda,pixels-turbo/pixels-scaling-ec2 \
            -am -DskipTests=false \
            -Dtest=TestIngestWriterAllocation,TestRetinaServer,TestRetinaIngestParticipantCheckpoint,TestDurableIngestCoordinatorGc,TestServerContainer,TestStorageGcWal,TestSqliteMainIndex#testRelocateEntriesPreservesRowIdsAndSurvivesRestart \
            -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.source.skip=true install \
            2>&1 | tee verification/pixels-build.log
          bash pixels/tools/verify-ingest-gc.sh \
            2>&1 | tee verification/journal-gc.log
          mvn -B -ntp -f pixels/pixels-daemon/pom.xml \
            -DskipTests=false -Dtest=TestPixelsIngestStorage \
            -Dpixels.retina.test.allocator="$PIXELS_HOME/lib/libjemalloc.so" test \
            2>&1 | tee verification/storage-rewrite.log
          mkdir -p verification/unit-tests
          cp pixels/pixels-daemon/target/surefire-reports/*TestIngestWriterAllocation* verification/unit-tests/
          cp pixels/pixels-daemon/target/surefire-reports/*TestPixelsIngestStorage* verification/unit-tests/
          cp pixels/pixels-daemon/target/surefire-reports/*TestDurableIngestCoordinatorGc* verification/unit-tests/
          cp pixels/pixels-daemon/target/surefire-reports/*TestServerContainer* verification/unit-tests/
          cp pixels/pixels-daemon/target/surefire-reports/*TestRetinaServer* verification/unit-tests/
          cp pixels/pixels-retina/target/surefire-reports/*TestRetinaIngestParticipantCheckpoint* verification/unit-tests/
          cp pixels/pixels-retina/target/surefire-reports/*TestStorageGcWal* verification/unit-tests/
          cp pixels/pixels-index/pixels-index-main-sqlite/target/surefire-reports/*TestSqliteMainIndex* verification/unit-tests/
      - name: Run production daemon lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output verification/etcd.tar.gz \
            https://github.com/etcd-io/etcd/releases/download/v3.5.17/etcd-v3.5.17-linux-amd64.tar.gz
          tar -xzf verification/etcd.tar.gz -C verification
          ETCD_BIN="$PWD/verification/etcd-v3.5.17-linux-amd64/etcd" \
            INGEST_DAEMON_SKIP_BUILD=1 \
            bash pixels/tools/verify-ingest-daemon.sh \
            2>&1 | tee verification/normal-daemon.log
          grep -q '^PIXELS_NORMAL_INGEST_DAEMON_PASS rows=1 pixelsFiles=1 services=TransServer,RetinaServer$' \
            "$INGEST_DAEMON_WORK_DIR/daemon.log"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Build the connector and run writer contracts
        shell: bash
        run: |
          set -euo pipefail
          bash pixels/tools/verify-ingest-contract.sh
          bash pixels-trino/tools/verify-ingest-contract.sh "$PWD/pixels"
          mvn -B -ntp -f pixels-trino/pom.xml -DskipTests=false \
            -Dtest=TestPixelsMutationWriter -Dsurefire.failIfNoSpecifiedTests=false test \
            2>&1 | tee verification/trino-build.log
      - name: Execute full SQL INSERT against Retina
        shell: bash
        run: |
          set -euo pipefail
          bash pixels-trino/tools/verify-sql-insert.sh "$PWD/pixels" -ntp \
            2>&1 | tee verification/full-sql.log
          test "$(cat "$SQL_E2E_WORK_DIR/exit-code")" = 0
          grep -Eq '(^|[[:space:]])FULL_SQL_INSERT_E2E_PASS checks=[0-9]+ rows=1008 trinoWorkers=2( |$)' "$SQL_E2E_WORK_DIR/sql.log"
          grep -q '^PIXELS_NATIVE_VISIBILITY_PASS iterations=1000$' "$SQL_E2E_WORK_DIR/backend.log"
          grep -q '^PIXELS_SQL_FIXTURE_STOPPED$' "$SQL_E2E_WORK_DIR/backend.log"
      - name: Record SQL verification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Full SQL INSERT verification'
            echo
            echo "Pixels: $(cat verification/pixels.commit)"
            echo "Pixels-Trino: $(cat verification/pixels-trino.commit)"
            echo
            echo '```text'
            if test -f "$INGEST_DAEMON_WORK_DIR/daemon.log"; then
              grep '^PIXELS_NORMAL_INGEST_DAEMON_PASS ' "$INGEST_DAEMON_WORK_DIR/daemon.log" || true
            fi
            if test -f verification/journal-gc.log; then
              grep -E '^(LocalMutationJournalContract:|Journal GC contract:)' verification/journal-gc.log || true
            fi
            if test -f "$SQL_E2E_WORK_DIR/sql.log"; then
              grep -E '(^|[[:space:]])(SQL_PASS |SQL_EXPECTED_REJECTION |FULL_SQL_INSERT_E2E_PASS )' "$SQL_E2E_WORK_DIR/sql.log" || true
            else
              echo 'SQL execution was not reached; inspect build logs.'
            fi
            echo '```'
            echo
            echo 'Catalog, node directory, and external ID allocation are fixtures. SQL execution, connector, TCP/gRPC, journals, Retina buffers, MainIndex, visibility, and file reads/writes are real.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-insert-e2e-evidence
          path: |
            verification/*.commit
            verification/*.log
            verification/unit-tests/*
            verification/daemon/*.log
            verification/sql/*.log
            verification/sql/exit-code
            verification/sql/status.properties
          retention-days: 7
          if-no-files-found: error
      - name: Archive exact tested sources
        if: always()
        shell: bash
        run: |
          mkdir -p source-snapshots
          git -C pixels archive --format=tar --prefix=pixels/ HEAD | gzip > source-snapshots/pixels.tar.gz
          git -C pixels-trino archive --format=tar --prefix=pixels-trino/ HEAD | gzip > source-snapshots/pixels-trino.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-insert-e2e-sources
          path: source-snapshots/
          retention-days: 3
