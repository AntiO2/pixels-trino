name: Import verified INSERT source

on:
  push:
    branches: [feat/trino-insert-180]
    paths:
      - .github/insert-e2e-transfer/**
      - .github/workflows/import-tested-insert.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'AntiO2/pixels-trino' && github.ref == 'refs/heads/feat/trino-insert-180'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify patch, commit source, and fast-forward the development branch
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/trino-insert-180
          test "$(git rev-parse HEAD^)" = d226e595d9bd48abcbce767e504ce0fc90fc382b
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          cat .github/insert-e2e-transfer/part-*.xz | xz --decompress > "$RUNNER_TEMP/insert.patch"
          echo "68bb35a2e84f592aec82398ddb4e7cb56665eb9997fd415ad78d33497fe9396b  $RUNNER_TEMP/insert.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/insert.patch"
          git apply --index "$RUNNER_TEMP/insert.patch"
          git diff --cached --check
          git diff --cached --stat
          git rm -r .github/insert-e2e-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[Issue #180] Enable the transactional INSERT SPI and add full SQL integration verification' -m 'Connect Page encoding, PageSink/provider registration, metadata callbacks, read leases, and transaction RPCs. Add a reproducible two-worker Trino 466 test with a separate Retina process and actual Pixels storage. Verify keyless inserts, duplicate rows, nulls, INSERT SELECT, concurrent commits, partial-stream Abort, and file reads. Requires AntiO2/pixels commit 67bcf6e032782d4ac974999edc88f5204e6b7eb4. Deployment bootstrap and GC remain separate follow-ups.'
          git push origin "HEAD:refs/heads/$branch"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
