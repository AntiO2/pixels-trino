name: Export INSERT build inputs
on:
  push:
    branches: [feat/trino-insert-180]
    paths:
      - .github/workflows/export-insert-build-inputs.yml
      - tools/ingest-contract/sql-runtime/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Resolve engine classpath
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification parts
          mvn -B -ntp -f tools/ingest-contract/sql-runtime/pom.xml org.apache.maven.plugins:maven-dependency-plugin:2.10:build-classpath -Dmdep.outputFile="$PWD/verification/engine.cp"
          git rev-parse HEAD > verification/source.commit
          cp tools/ingest-contract/sql-runtime/pom.xml verification/runtime.pom.xml
          tar -czf verification/engine-maven.tar.gz -C "$HOME/.m2" repository
          tar -cf - -C verification . | split -b 200M -d - parts/engine-inputs-
      - uses: actions/upload-artifact@v4
        with:
          name: engine-inputs-00
          path: parts/engine-inputs-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: engine-inputs-01
          path: parts/engine-inputs-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: engine-inputs-02
          path: parts/engine-inputs-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: engine-inputs-03
          path: parts/engine-inputs-03
          compression-level: 0
          retention-days: 3
