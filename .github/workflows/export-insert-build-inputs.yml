name: Export INSERT build inputs
on:
  push:
    branches: [feat/trino-insert-180]
    paths: [.github/workflows/export-insert-build-inputs.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Resolve engine classpath
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          mvn -B -ntp -f tools/ingest-contract/sql-runtime/pom.xml org.apache.maven.plugins:maven-dependency-plugin:2.10:build-classpath -Dmdep.outputFile="$PWD/verification/engine.cp"
          mvn -B -ntp -f tools/ingest-contract/sql-runtime/pom.xml org.apache.maven.plugins:maven-dependency-plugin:2.10:get -Dartifact=org.slf4j:slf4j-api:2.0.16
          tar -czf verification/engine-maven.tar.gz -C "$HOME/.m2" repository
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-build-inputs
          path: verification/
          retention-days: 1
