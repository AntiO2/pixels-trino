name: Transactional INSERT
on:
  push:
    branches: [feat/trino-insert-180]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transactional-insert-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIXELS_HOME: ${{ github.workspace }}/pixels-home
    steps:
      - uses: actions/checkout@v4
        with:
          path: pixels-trino
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AntiO2/pixels
          ref: 1ba21f9b83f2f7144b1b27515862acf466cb1e5e
          path: pixels
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Record dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification "$PIXELS_HOME/lib" "$PIXELS_HOME/etc"
          cp pixels/pixels-common/src/main/resources/pixels.properties "$PIXELS_HOME/etc/"
          git -C pixels rev-parse HEAD > verification/pixels.commit
          git -C pixels-trino rev-parse HEAD > verification/pixels-trino.commit
      - name: Build Pixels dependencies
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pixels/pom.xml -pl pixels-daemon,pixels-cache,pixels-storage/pixels-storage-redis,pixels-turbo/pixels-invoker-spike,pixels-turbo/pixels-invoker-vhive,pixels-turbo/pixels-invoker-lambda,pixels-turbo/pixels-scaling-ec2 -am -Dmaven.test.skip=true -Dmaven.source.skip=true install 2>&1 | tee verification/pixels-build.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Verify staging contracts
        shell: bash
        run: |
          set -euo pipefail
          bash pixels/tools/verify-ingest-contract.sh
          bash pixels-trino/tools/verify-ingest-contract.sh "$PWD/pixels"
      - name: Compile Trino and resolve JUnit provider
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pixels-trino/pom.xml -DskipTests=false -Dtest=TestPixelsMutationWriter -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee verification/trino-build.log
          mvn -B -ntp -f pixels/pom.xml org.apache.maven.plugins:maven-dependency-plugin:2.10:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:2.22.2
      - name: Preserve external dependency inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=repository/io/pixelsdb -czf verification/external-maven.tar.gz -C "$HOME/.m2" repository
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-build-inputs
          path: verification/
          retention-days: 1
