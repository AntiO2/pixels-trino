name: Part-1 offline verification dependencies
on:
  push:
    branches: [feat/trino-insert-180]
    paths: ['.github/workflows/part1-build-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download pinned lifecycle dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output etcd.tar.gz https://github.com/etcd-io/etcd/releases/download/v3.5.17/etcd-v3.5.17-linux-amd64.tar.gz
          curl --fail --location --retry 3 --output google-java-format.jar https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar
          sha256sum etcd.tar.gz google-java-format.jar > tools.sha256
          tar -xzf etcd.tar.gz
          ./etcd-v3.5.17-linux-amd64/etcd --version
      - uses: actions/upload-artifact@v4
        with:
          name: part1-lifecycle-tools
          path: |
            etcd.tar.gz
            google-java-format.jar
            tools.sha256
          retention-days: 1
