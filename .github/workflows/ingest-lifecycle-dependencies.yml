name: Ingest lifecycle test dependencies
on:
  push:
    branches: [feat/trino-insert-180]
    paths: ['.github/workflows/ingest-lifecycle-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etcd:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the pinned upstream etcd release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output etcd.tar.gz https://github.com/etcd-io/etcd/releases/download/v3.5.17/etcd-v3.5.17-linux-amd64.tar.gz
          tar -xzf etcd.tar.gz
          ./etcd-v3.5.17-linux-amd64/etcd --version
          sha256sum etcd.tar.gz > etcd.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ingest-lifecycle-etcd
          path: |
            etcd.tar.gz
            etcd.sha256
          retention-days: 3
